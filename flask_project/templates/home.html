{% extends 'layout.html' %}
        
{% block content %}
    <h1>Hello, {{name}}!</h1>
    <p>Welcome to my first Flask website!</p>
    <ul>
        {% for skill in skills %}
            <li>{{ skill }}</li>
        {% endfor %}
    </ul>
    {% if age >= 18 %}
        <p>You are an adult!</p>
    {% else %}
        <p>You are a Minor!</p>
    {% endif %}
{% endblock%}
